<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#12121a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.25" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="80" y="180" font-size="22" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6b7185">// senior ai engineer</text>

    <text x="80" y="300" font-size="82" font-weight="700" fill="#e6e6ec" letter-spacing="-2">David Lukić</text>

    <text x="80" y="400" font-size="42" font-weight="600" letter-spacing="-1">
      <tspan fill="#e6e6ec">Shipping </tspan>
      <tspan fill="url(#brand)">production LLM</tspan>
      <tspan fill="#e6e6ec"> &amp; </tspan>
      <tspan fill="url(#brand)">multi-agent</tspan>
      <tspan fill="#e6e6ec"> systems.</tspan>
    </text>

    <text x="80" y="470" font-size="24" fill="#9ba1b0">
      7+ years · RAG · MCP · MLOps · Top Rated Upwork · 100% JSS
    </text>

    <g transform="translate(80, 540)">
      <rect x="0" y="0" width="1040" height="1" fill="rgba(255,255,255,0.08)"/>
    </g>

    <g transform="translate(80, 575)" font-size="22" fill="#9ba1b0">
      <text>davidlukic99.github.io</text>
      <text x="1040" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, monospace" fill="#6b7185">$ connect</text>
    </g>
  </g>

  <g transform="translate(1040, 80)">
    <rect width="80" height="80" rx="18" fill="#0a0a0f" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
    <text x="40" y="56" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="38" font-weight="700" text-anchor="middle" fill="url(#brand)">dl</text>
  </g>
</svg>
